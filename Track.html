<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Track — Daily Task List</title>
<style>
  :root {
    --bg: #202327;
    --side: #24272b;
    --card: #2d3136;
    --card-2: #34383e;
    --field: #3a3f46;
    --text: #e9ebee;
    --muted: #a6adb6;
    --faint: #6d747e;
    --line: rgba(255, 255, 255, 0.07);
    --line-soft: rgba(255, 255, 255, 0.045);
    --teal: #2fb5a3;
    --teal-strong: #29a392;
    --teal-ghost: rgba(47, 181, 163, 0.12);
    --green: #4fc17a;
    --danger: #e07070;
    --radius: 10px;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  ::selection { background: var(--teal); color: #10201c; }
  button { font: inherit; cursor: pointer; transition: background .12s, border-color .12s, color .12s, filter .12s; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .app { display: flex; min-height: 100vh; }

  /* ================= sidebar ================= */
  .side {
    width: 248px;
    flex-shrink: 0;
    background: var(--side);
    border-right: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    gap: 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 8px 4px;
    user-select: none;
  }
  .brand .glyph { color: var(--teal); font-size: 17px; }
  .brand .name { font-size: 17px; font-weight: 650; letter-spacing: .2px; }

  .side h2 {
    margin: 0 0 8px;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--faint);
    user-select: none;
  }
  .side section { min-height: 0; }
  .side .grow { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; }

  .daylist {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .daylist li + li { margin-top: 2px; }
  .daylist button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    font-size: 13.5px;
    border: none;
    border-radius: 8px;
    background: none;
    text-align: left;
    color: var(--muted);
  }
  .daylist button:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
  .daylist button.current {
    background: rgba(255, 255, 255, 0.09);
    color: var(--text);
    font-weight: 600;
  }
  .daylist .count {
    color: var(--faint);
    font-size: 11.5px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 1px 8px;
  }
  .daylist button.current .count { color: var(--teal); background: var(--teal-ghost); }
  .nothing { color: var(--faint); font-size: 13px; padding: 4px 10px; }

  /* wishlist */
  .wish-add { display: flex; gap: 6px; padding: 0 2px 8px; }
  .wish-add input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .wish-add input::placeholder { color: var(--faint); }
  .wish-add input:focus { outline: none; border-color: var(--teal); }
  .wish-add button {
    width: 32px;
    border: none;
    border-radius: 8px;
    background: var(--teal);
    color: #0e1f1b;
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
  }
  .wish-add button:hover { background: #3ac9b6; }

  ul.wishlist {
    list-style: none;
    margin: 0;
    padding: 0 2px;
    max-height: 220px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  ul.wishlist li {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: grab;
  }
  ul.wishlist li:hover { background: rgba(255, 255, 255, 0.05); }
  ul.wishlist li.dragging { opacity: .35; }
  ul.wishlist .grip { color: var(--faint); font-size: 11px; padding-top: 3px; user-select: none; }
  ul.wishlist .wtxt {
    flex: 1;
    font-size: 13px;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 6px;
    padding: 0 2px;
  }
  ul.wishlist li:hover .wtxt { color: var(--text); }
  ul.wishlist .wtxt:focus { outline: none; background: var(--teal-ghost); box-shadow: inset 0 -1px 0 var(--teal); }
  ul.wishlist .wbtn {
    border: none;
    background: none;
    color: var(--faint);
    padding: 0 3px;
    font-size: 13px;
    border-radius: 6px;
    opacity: 0;
  }
  ul.wishlist li:hover .wbtn, ul.wishlist .wbtn:focus-visible { opacity: 1; }
  ul.wishlist .wbtn.send:hover { color: var(--teal); }
  ul.wishlist .wbtn.kill:hover { color: var(--danger); }
  .wish-hint { padding: 8px 10px 0; color: var(--faint); font-size: 11px; user-select: none; }

  /* sidebar bottom buttons */
  .side .tools { display: flex; flex-direction: column; gap: 8px; }
  .tools .row { display: flex; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
  .tools .row button {
    flex: 1;
    border: none;
    padding: 8px 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--card-2);
  }
  .tools .row button + button { border-left: 1px solid rgba(0, 0, 0, 0.25); }
  .tools .row button:hover { filter: brightness(1.15); }
  .tools .row.accent button { background: var(--teal-strong); color: #0e1f1b; }
  .tools .row.accent button:hover { filter: brightness(1.08); }

  /* ================= main ================= */
  .main {
    flex: 1;
    min-width: 0;
    padding: 26px 34px 80px;
    max-width: 880px;
  }
  .main-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .main-head h1 { margin: 0; font-size: 20px; font-weight: 650; margin-right: auto; }
  .saved-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12.5px;
    color: var(--muted);
    box-shadow: var(--shadow);
    user-select: none;
    transition: border-color .3s;
  }
  .saved-pill .dot { color: var(--green); font-size: 13px; }
  .saved-pill.pulse { border-color: var(--green); }

  /* date navigator row */
  .nav-row {
    display: flex;
    gap: 14px;
    align-items: stretch;
    margin-bottom: 18px;
  }
  .datenav {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px 12px;
  }
  .datenav .arrow {
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card-2);
    color: var(--text);
    font-size: 16px;
  }
  .datenav .arrow:hover { border-color: var(--teal); color: var(--teal); }
  .datenav .datewrap {
    position: relative;
    flex: 1;
    text-align: center;
  }
  .datenav .bigdate {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .2px;
    padding: 4px 0;
    cursor: pointer;
    border-radius: 8px;
  }
  .datenav .bigdate:hover { background: rgba(255, 255, 255, 0.04); }
  .datenav input[type="date"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    border: none;
  }
  .side-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: center;
  }
  .side-actions button {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    padding: 7px 16px;
    font-size: 13px;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .side-actions button:hover { border-color: var(--teal); color: var(--teal); }

  /* entries */
  .logzone { border-radius: var(--radius); }
  .logzone.droptarget { outline: 2px dashed var(--teal); outline-offset: 4px; }
  .daylist button.droptarget { outline: 2px dashed var(--teal); outline-offset: -2px; }

  .day-sub { color: var(--faint); font-size: 12.5px; margin: 0 2px 10px; min-height: 1.2em; }

  .addcard {
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px;
    margin-bottom: 14px;
  }
  .addcard input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 13px;
  }
  .addcard input::placeholder { color: var(--faint); }
  .addcard input:focus { outline: none; border-color: var(--teal); }
  .addcard button {
    border: none;
    border-radius: 8px;
    background: var(--teal);
    color: #0e1f1b;
    font-weight: 650;
    padding: 0 22px;
  }
  .addcard button:hover { background: #3ac9b6; }

  ol.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ol.items li.entry {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-2);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 11px 16px;
  }
  ol.items li.entry .txt {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
  }
  ol.items li.entry .icon {
    border: none;
    background: none;
    color: var(--faint);
    font-size: 14px;
    padding: 2px 5px;
    border-radius: 6px;
    opacity: 0;
  }
  ol.items li.entry:hover .icon, ol.items li.entry .icon:focus-visible { opacity: 1; }
  ol.items li.entry .icon.edit:hover { color: var(--teal); }
  ol.items li.entry .icon.del:hover { color: var(--danger); }

  ol.items li.editing {
    display: block;
    background: var(--card-2);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px;
  }
  ol.items li.editing input {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    padding: 9px 13px;
    margin-bottom: 10px;
  }
  ol.items li.editing input:focus { outline: none; border-color: var(--teal); }
  .editrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .editrow button {
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-weight: 650;
    font-size: 13px;
    letter-spacing: .6px;
    text-transform: uppercase;
  }
  .editrow .save { background: var(--teal-strong); color: #0e1f1b; }
  .editrow .save:hover { filter: brightness(1.1); }
  .editrow .cancel { background: #4a4f56; color: var(--text); }
  .editrow .cancel:hover { filter: brightness(1.12); }

  .empty {
    color: var(--faint);
    text-align: center;
    padding: 34px 10px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    font-size: 13.5px;
  }

  .foot-actions { display: flex; margin-top: 14px; }
  .foot-actions .spacer { flex: 1; }
  .clearday {
    border: none;
    background: none;
    color: var(--faint);
    font-size: 12.5px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .clearday:hover { color: var(--danger); background: rgba(224, 112, 112, 0.08); }

  /* floating add */
  .fab {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--teal);
    color: #0e1f1b;
    font-size: 26px;
    line-height: 1;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .fab:hover { background: #3ac9b6; transform: translateY(-1px); }

  /* toast */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(12px);
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .side { width: 100%; border-right: none; border-bottom: 1px solid var(--line-soft); }
    .main { padding: 20px 16px 90px; }
    .nav-row { flex-direction: column; }
    .side-actions { flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <span class="glyph">≡</span>
      <span class="name">Track</span>
    </div>

    <section class="grow">
      <h2>Recent days</h2>
      <ul class="daylist" id="dayList"></ul>
    </section>

    <section>
      <h2>Wishlist <span id="wishCount" style="color:var(--teal)"></span></h2>
      <div class="wish-add">
        <input type="text" id="newWish" placeholder="Needs doing…" autocomplete="off">
        <button id="addWishBtn" title="Add to wishlist">+</button>
      </div>
      <ul class="wishlist" id="wishList"></ul>
      <div class="wish-hint">Drag onto the log or a day · ↳ sends to open day</div>
    </section>

    <section class="tools">
      <div class="row accent">
        <button id="exportBtn" title="Save all data to a JSON file">Export (JSON)</button>
        <button id="importBtn" title="Load data from a JSON backup file">Import</button>
      </div>
      <div class="row">
        <button id="csvImportBtn" title="Import entries from a CSV file (date, task)">CSV Import</button>
        <button id="csvExportBtn" title="Export all entries as a CSV file">CSV Export</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
    </section>
  </aside>

  <main class="main">
    <div class="main-head">
      <h1 id="dayTitle"></h1>
      <div class="saved-pill" id="savedPill"><span class="dot">●</span> Data auto-saved locally</div>
    </div>

    <div class="nav-row">
      <div class="datenav">
        <button class="arrow" id="prevDay" title="Previous day">‹</button>
        <div class="datewrap">
          <div class="bigdate" id="navDate" title="Pick a date"></div>
          <input type="date" id="datePick" tabindex="-1">
        </div>
        <button class="arrow" id="nextDay" title="Next day">›</button>
      </div>
      <div class="side-actions">
        <button id="copyDay">Copy Day to Clipboard</button>
        <button id="copyPlain" title="Copies just the items, one per line, no date heading">Copy Items Only</button>
        <button id="todayBtn">Jump to Today</button>
      </div>
    </div>

    <div class="logzone" id="logPanel">
      <p class="day-sub" id="daySub"></p>

      <div class="addcard">
        <input type="text" id="newItem" placeholder="What did you do? Press Enter to log it…" autocomplete="off">
        <button id="addBtn">Add</button>
      </div>

      <ol class="items" id="itemList"></ol>
      <div class="empty" id="emptyMsg">No entries for this day yet — add your first one above.</div>

      <div class="foot-actions">
        <span class="spacer"></span>
        <button class="clearday" id="clearDay">Clear this day…</button>
      </div>
    </div>
  </main>
</div>

<button class="fab" id="fab" title="Add an entry">+</button>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "track.tasks.v1";
  var WISH_KEY = "track.wishlist.v1";
  var data = load();          // { "YYYY-MM-DD": [{id, text}, ...] }
  var wishlist = loadWishlist(); // [{id, text}, ...]
  var currentDate = todayISO();
  var editingId = null;

  // ---------- storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
    } catch (e) { return {}; }
  }
  function save() {
    // prune empty days so the sidebar stays clean
    Object.keys(data).forEach(function (d) {
      if (!data[d] || data[d].length === 0) delete data[d];
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    pulseSaved();
  }
  function newId() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  }
  function loadWishlist() {
    try {
      var raw = localStorage.getItem(WISH_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.filter(function (it) {
        return it && typeof it.text === "string" && it.text !== "";
      }) : [];
    } catch (e) { return []; }
  }
  function saveWishlist() {
    localStorage.setItem(WISH_KEY, JSON.stringify(wishlist));
    pulseSaved();
  }
  var pulseTimer;
  function pulseSaved() {
    var p = document.getElementById("savedPill");
    p.classList.add("pulse");
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(function () { p.classList.remove("pulse"); }, 900);
  }

  // ---------- date helpers ----------
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function shiftDay(iso, delta) {
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2] + delta);
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function dateObj(iso) {
    var p = iso.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function prettyDate(iso) {
    return dateObj(iso).toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
  }
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function shortLabel(iso) {
    var d = dateObj(iso);
    var label = DOW[d.getDay()] + " " + MON[d.getMonth()] + " " + d.getDate();
    if (d.getFullYear() !== new Date().getFullYear()) label += " " + d.getFullYear();
    return label;
  }
  function shortDow(iso) { return DOW[dateObj(iso).getDay()]; }

  // Accepts 2026-07-05, 2026/07/05, 05/07/2026, 5-7-2026, 05.07.2026.
  // Day-first is assumed for d/m/y unless the first number can only be a month.
  function parseDateFlexible(s) {
    s = String(s || "").trim();
    var m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
    var y, mo, d;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else {
      m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
      if (!m) return null;
      d = +m[1]; mo = +m[2]; y = +m[3];
      if (mo > 12 && d <= 12) { var t = d; d = mo; mo = t; } // clearly month-first
    }
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var check = new Date(y, mo - 1, d);
    if (check.getFullYear() !== y || check.getMonth() !== mo - 1 || check.getDate() !== d) return null;
    return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }

  // ---------- rendering ----------
  var $ = function (id) { return document.getElementById(id); };

  function items() {
    if (!data[currentDate]) data[currentDate] = [];
    return data[currentDate];
  }

  function render() {
    $("datePick").value = currentDate;
    $("dayTitle").textContent = "Log for " + prettyDate(currentDate);
    $("navDate").textContent = prettyDate(currentDate);

    var list = data[currentDate] || [];
    $("daySub").textContent = list.length === 0 ? "" :
      list.length + (list.length === 1 ? " entry" : " entries");

    var ol = $("itemList");
    ol.innerHTML = "";
    list.forEach(function (item) {
      ol.appendChild(item.id === editingId ? buildEditor(item) : buildEntry(item));
    });

    $("emptyMsg").style.display = list.length === 0 ? "" : "none";
    $("clearDay").style.display = list.length === 0 ? "none" : "";
    renderSidebar();
    renderWishlist();
  }

  function buildEntry(item) {
    var li = document.createElement("li");
    li.className = "entry";

    var txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = item.text;
    txt.addEventListener("dblclick", function () { startEdit(item.id); });

    var edit = document.createElement("button");
    edit.className = "icon edit";
    edit.title = "Edit entry";
    edit.textContent = "✎";
    edit.addEventListener("click", function () { startEdit(item.id); });

    var del = document.createElement("button");
    del.className = "icon del";
    del.title = "Delete entry";
    del.textContent = "✕";
    del.addEventListener("click", function () { removeItem(item.id); });

    li.appendChild(txt);
    li.appendChild(edit);
    li.appendChild(del);
    return li;
  }

  function buildEditor(item) {
    var li = document.createElement("li");
    li.className = "editing";

    var input = document.createElement("input");
    input.type = "text";
    input.value = item.text;

    function commit() {
      var v = input.value.trim();
      editingId = null;
      if (v === "") { removeItem(item.id); return; }
      if (v !== item.text) { item.text = v; save(); }
      render();
    }
    function cancel() {
      editingId = null;
      render();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") commit();
      if (e.key === "Escape") cancel();
    });

    var row = document.createElement("div");
    row.className = "editrow";
    var saveBtn = document.createElement("button");
    saveBtn.className = "save";
    saveBtn.textContent = "Save";
    saveBtn.addEventListener("click", commit);
    var cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", cancel);
    row.appendChild(saveBtn);
    row.appendChild(cancelBtn);

    li.appendChild(input);
    li.appendChild(row);
    setTimeout(function () { input.focus(); input.select(); }, 0);
    return li;
  }

  function startEdit(id) {
    editingId = id;
    render();
  }

  function renderSidebar() {
    var ul = $("dayList");
    ul.innerHTML = "";
    var days = Object.keys(data).filter(function (d) {
      return data[d] && data[d].length > 0;
    });
    if (days.indexOf(currentDate) === -1) days.push(currentDate);
    days.sort().reverse();

    days.forEach(function (d) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      if (d === currentDate) btn.className = "current";
      var label = document.createElement("span");
      label.textContent = shortLabel(d);
      btn.appendChild(label);
      var n = (data[d] || []).length;
      if (n > 0) {
        var count = document.createElement("span");
        count.className = "count";
        count.textContent = n;
        btn.appendChild(count);
      }
      btn.addEventListener("click", function () {
        currentDate = d;
        editingId = null;
        render();
      });
      makeDropTarget(btn, function () { return d; });
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  // ---------- wishlist ----------
  function makeDropTarget(el, getDay) {
    el.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      el.classList.add("droptarget");
    });
    el.addEventListener("dragleave", function () {
      el.classList.remove("droptarget");
    });
    el.addEventListener("drop", function (e) {
      e.preventDefault();
      el.classList.remove("droptarget");
      var id = e.dataTransfer.getData("text/plain");
      if (id) moveWishToDay(id, getDay());
    });
  }

  function moveWishToDay(id, day) {
    var i = wishlist.findIndex(function (it) { return it.id === id; });
    if (i === -1) return;
    var item = wishlist.splice(i, 1)[0];
    if (!data[day]) data[day] = [];
    data[day].push({ id: newId(), text: item.text });
    saveWishlist();
    save();
    render();
    toast("Moved to " + shortDow(day) + " " + day);
  }

  function addWish() {
    var input = $("newWish");
    var v = input.value.trim();
    if (v === "") return;
    wishlist.push({ id: newId(), text: v });
    input.value = "";
    saveWishlist();
    renderWishlist();
    input.focus();
  }

  function removeWish(id) {
    var i = wishlist.findIndex(function (it) { return it.id === id; });
    if (i !== -1) wishlist.splice(i, 1);
    saveWishlist();
    renderWishlist();
  }

  function renderWishlist() {
    $("wishCount").textContent = wishlist.length ? "· " + wishlist.length : "";
    var ul = $("wishList");
    ul.innerHTML = "";

    if (wishlist.length === 0) {
      var li = document.createElement("li");
      li.style.cursor = "default";
      var span = document.createElement("span");
      span.className = "nothing";
      span.textContent = "Nothing queued";
      li.appendChild(span);
      ul.appendChild(li);
      return;
    }

    wishlist.forEach(function (item) {
      var li = document.createElement("li");
      li.draggable = true;

      var grip = document.createElement("span");
      grip.className = "grip";
      grip.textContent = "⣿";

      var txt = document.createElement("div");
      txt.className = "wtxt";
      txt.textContent = item.text;
      txt.spellcheck = false;
      txt.title = "Click to edit · drag to a day";

      li.addEventListener("dragstart", function (e) {
        // an active edit means the user is typing, not dragging
        if (txt.isContentEditable) { e.preventDefault(); return; }
        e.dataTransfer.setData("text/plain", item.id);
        e.dataTransfer.effectAllowed = "move";
        li.classList.add("dragging");
      });
      li.addEventListener("dragend", function () {
        li.classList.remove("dragging");
      });

      // Editable only on click: an always-on contenteditable hijacks
      // mouse-drags into text selection and makes the li undraggable.
      txt.addEventListener("click", function (e) {
        if (txt.isContentEditable) return;
        txt.contentEditable = "plaintext-only";
        if (!txt.isContentEditable) txt.contentEditable = "true";
        txt.focus();
        if (document.caretRangeFromPoint) {
          var r = document.caretRangeFromPoint(e.clientX, e.clientY);
          if (r) {
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
          }
        }
      });
      txt.addEventListener("blur", function () {
        txt.contentEditable = "false";
        var v = txt.textContent.trim();
        if (v === "") {
          removeWish(item.id);
        } else if (v !== item.text) {
          item.text = v;
          saveWishlist();
        }
      });
      txt.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); txt.blur(); }
        if (e.key === "Escape") { txt.textContent = item.text; txt.blur(); }
      });

      var send = document.createElement("button");
      send.className = "wbtn send";
      send.textContent = "↳";
      send.title = "Log on open day (" + currentDate + ")";
      send.addEventListener("click", function () { moveWishToDay(item.id, currentDate); });

      var kill = document.createElement("button");
      kill.className = "wbtn kill";
      kill.textContent = "✕";
      kill.title = "Delete from wishlist";
      kill.addEventListener("click", function () { removeWish(item.id); });

      li.appendChild(grip);
      li.appendChild(txt);
      li.appendChild(send);
      li.appendChild(kill);
      ul.appendChild(li);
    });
  }

  // ---------- actions ----------
  function addItem() {
    var input = $("newItem");
    var v = input.value.trim();
    if (v === "") return;
    items().push({ id: newId(), text: v });
    input.value = "";
    save();
    render();
    input.focus();
  }

  function removeItem(id) {
    var list = items();
    var i = list.findIndex(function (it) { return it.id === id; });
    if (i !== -1) list.splice(i, 1);
    if (editingId === id) editingId = null;
    save();
    render();
  }

  function dayAsText(withHeading) {
    var list = data[currentDate] || [];
    var lines = list.map(function (it) { return (withHeading ? "- " : "") + it.text; });
    if (withHeading) lines.unshift(prettyDate(currentDate), "");
    return lines.join("\n");
  }

  function copyText(text, doneMsg) {
    if (text.trim() === "") { toast("Nothing to copy — the day is empty"); return; }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast(doneMsg); }
      catch (e) { toast("Copy failed — select and copy manually"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(doneMsg); }, fallback);
    } else {
      fallback();
    }
  }

  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function downloadFile(name, content, mime) {
    var blob = new Blob([content], { type: mime });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  // ---------- CSV ----------
  // Handles quoted fields, "" escapes, CRLF, and auto-detects , ; or tab.
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
    var firstLine = text.slice(0, text.indexOf("\n") === -1 ? text.length : text.indexOf("\n"));
    var delim = ",";
    var best = (firstLine.match(/,/g) || []).length;
    [[";", (firstLine.match(/;/g) || []).length], ["\t", (firstLine.match(/\t/g) || []).length]]
      .forEach(function (c) { if (c[1] > best) { best = c[1]; delim = c[0]; } });

    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQ = false;
        } else field += c;
      } else if (c === '"') {
        inQ = true;
      } else if (c === delim) {
        row.push(field); field = "";
      } else if (c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
      } else if (c !== "\r") {
        field += c;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) {
      return r.some(function (f) { return f.trim() !== ""; });
    });
  }

  function csvQuote(s) {
    return /[",;\t\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCSV() {
    var days = Object.keys(data).sort();
    if (days.length === 0) { toast("Nothing to export"); return; }
    var lines = ["Date,Task"];
    days.forEach(function (d) {
      data[d].forEach(function (it) {
        lines.push(d + "," + csvQuote(it.text));
      });
    });
    // BOM so Excel opens it as UTF-8
    downloadFile("track-export-" + todayISO() + ".csv", "﻿" + lines.join("\r\n"), "text/csv");
    toast("CSV exported");
  }

  // Expected shape: one entry per row — date in the first column, task in the
  // second (extra columns are appended to the task). Merges, skips duplicates.
  function importCSV(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result));
      if (rows.length === 0) { toast("CSV is empty"); return; }
      var start = parseDateFlexible(rows[0][0]) ? 0 : 1; // skip header row
      var added = 0, skipped = 0, daysTouched = {};
      for (var i = start; i < rows.length; i++) {
        var day = parseDateFlexible(rows[i][0]);
        var text = rows[i].slice(1)
          .map(function (f) { return f.trim(); })
          .filter(function (f) { return f !== ""; })
          .join(", ");
        if (!day || text === "") { skipped++; continue; }
        if (!data[day]) data[day] = [];
        var dup = data[day].some(function (it) { return it.text === text; });
        if (dup) { skipped++; continue; }
        data[day].push({ id: newId(), text: text });
        daysTouched[day] = true;
        added++;
      }
      save();
      render();
      var dayCount = Object.keys(daysTouched).length;
      if (added === 0) {
        toast("Nothing imported — " + skipped + " row" + (skipped === 1 ? "" : "s") + " skipped (duplicate or unreadable)");
      } else {
        toast("Imported " + added + " entr" + (added === 1 ? "y" : "ies") +
          " across " + dayCount + " day" + (dayCount === 1 ? "" : "s") +
          (skipped ? " — " + skipped + " skipped" : ""));
      }
    };
    reader.readAsText(file);
  }

  // ---------- JSON backup ----------
  function exportData() {
    var payload = {};
    Object.keys(data).forEach(function (d) { payload[d] = data[d]; });
    payload._wishlist = wishlist;
    downloadFile("track-backup-" + todayISO() + ".json",
      JSON.stringify(payload, null, 2), "application/json");
    toast("Backup exported");
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) {
          throw new Error("bad format");
        }
        var added = 0;
        if (Array.isArray(incoming._wishlist)) {
          var wishTexts = wishlist.map(function (it) { return it.text; });
          incoming._wishlist.forEach(function (it) {
            var text = (it && typeof it.text === "string") ? it.text
                     : (typeof it === "string") ? it : null;
            if (text && wishTexts.indexOf(text) === -1) {
              wishlist.push({ id: newId(), text: text });
              wishTexts.push(text);
              added++;
            }
          });
          saveWishlist();
        }
        Object.keys(incoming).forEach(function (day) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Array.isArray(incoming[day])) return;
          if (!data[day]) data[day] = [];
          var existing = data[day].map(function (it) { return it.text; });
          incoming[day].forEach(function (it) {
            var text = (it && typeof it.text === "string") ? it.text
                     : (typeof it === "string") ? it : null;
            if (text && existing.indexOf(text) === -1) {
              data[day].push({ id: newId(), text: text });
              existing.push(text);
              added++;
            }
          });
        });
        save();
        render();
        toast("Imported " + added + " entr" + (added === 1 ? "y" : "ies"));
      } catch (e) {
        toast("Import failed — not a valid Track backup file");
      }
    };
    reader.readAsText(file);
  }

  // ---------- wiring ----------
  makeDropTarget($("logPanel"), function () { return currentDate; });
  $("addWishBtn").addEventListener("click", addWish);
  $("newWish").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addWish();
  });
  $("addBtn").addEventListener("click", addItem);
  $("newItem").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addItem();
  });
  $("datePick").addEventListener("change", function () {
    if (this.value) { currentDate = this.value; editingId = null; render(); }
  });
  $("navDate").addEventListener("click", function () {
    var input = $("datePick");
    if (input.showPicker) { try { input.showPicker(); return; } catch (e) {} }
    input.click();
  });
  $("prevDay").addEventListener("click", function () {
    currentDate = shiftDay(currentDate, -1); editingId = null; render();
  });
  $("nextDay").addEventListener("click", function () {
    currentDate = shiftDay(currentDate, 1); editingId = null; render();
  });
  $("todayBtn").addEventListener("click", function () {
    currentDate = todayISO(); editingId = null; render();
  });
  $("fab").addEventListener("click", function () {
    $("newItem").focus();
    $("newItem").scrollIntoView({ block: "center", behavior: "smooth" });
  });
  $("copyDay").addEventListener("click", function () {
    copyText(dayAsText(true), "Day copied to clipboard");
  });
  $("copyPlain").addEventListener("click", function () {
    copyText(dayAsText(false), "Entries copied to clipboard");
  });
  $("clearDay").addEventListener("click", function () {
    var list = data[currentDate] || [];
    if (list.length === 0) { toast("Day is already empty"); return; }
    if (confirm("Delete all " + list.length + " entr" + (list.length === 1 ? "y" : "ies") + " for " + prettyDate(currentDate) + "?")) {
      delete data[currentDate];
      editingId = null;
      save();
      render();
      toast("Day cleared");
    }
  });
  $("csvExportBtn").addEventListener("click", exportCSV);
  $("csvImportBtn").addEventListener("click", function () { $("csvFile").click(); });
  $("csvFile").addEventListener("change", function () {
    if (this.files && this.files[0]) importCSV(this.files[0]);
    this.value = "";
  });
  $("exportBtn").addEventListener("click", exportData);
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    if (this.files && this.files[0]) importData(this.files[0]);
    this.value = "";
  });

  render();
  $("newItem").focus();
})();
</script>
</body>
</html>
