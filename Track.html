<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>TRACK — daily log</title>
<style>
  :root {
    --bg: #0c1015;
    --bg-panel: #11161d;
    --bg-inset: #0a0e13;
    --ink: #d3dae3;
    --ink-dim: #8a95a3;
    --ink-faint: #505c6b;
    --line: #1c232d;
    --line-strong: #2a3542;
    --accent: #3ce6a6;
    --accent-dim: #22a06e;
    --accent-ghost: rgba(60, 230, 166, 0.07);
    --danger: #e06c6c;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Cascadia Code", "Cascadia Mono", Consolas, "JetBrains Mono", "Fira Code", monospace;
    font-size: 14px;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.006) 2px 4px),
      var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  ::selection { background: var(--accent); color: #06120c; }

  .frame {
    max-width: 980px;
    margin: 0 auto;
    padding: 30px 20px 80px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--line-strong);
    background: var(--bg-panel);
    padding: 10px 16px;
    margin-bottom: 22px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-right: auto;
    user-select: none;
  }
  .brand .mark {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 16px;
  }
  .brand .mark::before { content: "▮ "; animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .brand .tag {
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .datebar { display: flex; align-items: center; gap: 8px; }

  /* ---------- controls ---------- */
  button, input[type="date"] {
    font: inherit;
    font-size: 12.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--bg-inset);
    border: 1px solid var(--line-strong);
    border-radius: 0;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .1s, color .1s, border-color .1s;
  }
  input[type="date"] { cursor: auto; text-transform: none; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.65); cursor: pointer; }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button:active { background: var(--accent-ghost); }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #071410;
    font-weight: 700;
  }
  button.primary:hover { background: #5cf0b8; border-color: #5cf0b8; color: #071410; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ---------- layout ---------- */
  .cols {
    display: grid;
    grid-template-columns: 1fr 250px;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 780px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    border: 1px solid var(--line-strong);
    background: var(--bg-panel);
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px dashed var(--line-strong);
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    user-select: none;
  }
  .panel-head .rule { flex: 1; border-top: 1px dashed var(--line); align-self: center; }
  .panel-head .hl { color: var(--accent); }
  .panel-body { padding: 18px; }

  .day-title {
    margin: 0 0 2px;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .day-title .dow { color: var(--accent); }
  .day-sub {
    margin: 0 0 18px;
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: 1px;
    min-height: 1.2em;
  }

  /* ---------- add row ---------- */
  .addrow { display: flex; gap: 0; margin-bottom: 18px; }
  .addrow .prompt {
    display: flex;
    align-items: center;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-right: none;
    background: var(--bg-inset);
    color: var(--accent);
    user-select: none;
  }
  .addrow input[type="text"] {
    flex: 1;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg-inset);
    border: 1px solid var(--line-strong);
    border-left: none;
    border-right: none;
    border-radius: 0;
    padding: 9px 4px 9px 0;
    caret-color: var(--accent);
  }
  .addrow input[type="text"]::placeholder { color: var(--ink-faint); }
  .addrow input[type="text"]:focus { outline: none; }
  .addrow:focus-within .prompt,
  .addrow:focus-within input[type="text"],
  .addrow:focus-within button { border-color: var(--accent-dim); }
  .addrow button { border-left: none; }

  /* ---------- log lines ---------- */
  ol.items { list-style: none; margin: 0; padding: 0; counter-reset: line; }
  ol.items li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 7px 8px 7px 4px;
    border-bottom: 1px solid var(--line);
  }
  ol.items li:hover { background: var(--accent-ghost); }
  ol.items li .num {
    counter-increment: line;
    color: var(--ink-faint);
    user-select: none;
    min-width: 26px;
    text-align: right;
  }
  ol.items li .num::before { content: counter(line, decimal-leading-zero); }
  ol.items li .num::after { content: " ▸"; color: var(--accent-dim); }
  ol.items li .txt {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
    padding: 0 4px;
  }
  ol.items li .txt:focus {
    outline: none;
    background: var(--accent-ghost);
    box-shadow: inset 0 -1px 0 var(--accent);
  }
  ol.items li .del {
    border: none;
    background: none;
    color: var(--ink-faint);
    padding: 0 6px;
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0;
    opacity: 0;
    transition: opacity .1s, color .1s;
  }
  ol.items li:hover .del, ol.items li .del:focus-visible { opacity: 1; }
  ol.items li .del:hover { color: var(--danger); border-color: transparent; background: none; }

  .empty {
    color: var(--ink-faint);
    padding: 30px 10px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .empty .glyph { display: block; color: var(--line-strong); font-size: 15px; margin-bottom: 8px; letter-spacing: 4px; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--line-strong);
  }
  .actions .spacer { flex: 1; }

  /* ---------- sidebar ---------- */
  .daylist {
    list-style: none;
    margin: 0;
    padding: 6px;
    max-height: 380px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  .daylist li + li { margin-top: 2px; }
  .daylist button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    letter-spacing: 1px;
    border: 1px solid transparent;
    background: none;
    text-align: left;
    color: var(--ink-dim);
    text-transform: none;
  }
  .daylist button:hover { color: var(--accent); border-color: transparent; }
  .daylist button.current {
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    background: var(--accent-ghost);
  }
  .daylist .count { color: var(--ink-faint); font-size: 12px; }
  .daylist button.current .count { color: var(--accent-dim); }
  .nothing { color: var(--ink-faint); font-size: 12.5px; padding: 6px 10px; }

  .backup {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px dashed var(--line-strong);
  }
  .backup + .backup { border-top: none; padding-top: 0; }
  .backup button { flex: 1; font-size: 11.5px; padding: 5px 6px; }
  .backup-label {
    padding: 10px 12px 0;
    border-top: 1px dashed var(--line-strong);
    color: var(--ink-faint);
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    user-select: none;
  }
  .backup-label + .backup { border-top: none; }

  footer {
    margin-top: 26px;
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    user-select: none;
  }

  /* ---------- toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(10px);
    background: #0f1712;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 8px 18px;
    font-size: 12.5px;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  #toast::before { content: ":: "; color: var(--ink-faint); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="frame">

  <div class="topbar">
    <div class="brand">
      <span class="mark">TRACK</span>
      <span class="tag">daily log // local</span>
    </div>
    <div class="datebar">
      <button id="prevDay" title="Previous day">‹</button>
      <input type="date" id="datePick">
      <button id="nextDay" title="Next day">›</button>
      <button id="todayBtn">Today</button>
    </div>
  </div>

  <div class="cols">
    <main class="panel">
      <div class="panel-head">
        <span>log</span><span class="rule"></span><span class="hl" id="headDate"></span>
      </div>
      <div class="panel-body">
        <p class="day-title" id="dayTitle"></p>
        <p class="day-sub" id="daySub"></p>

        <div class="addrow">
          <span class="prompt">&gt;</span>
          <input type="text" id="newItem" placeholder="what did you do? [enter] to log it" autocomplete="off">
          <button class="primary" id="addBtn">Add</button>
        </div>

        <ol class="items" id="itemList"></ol>
        <div class="empty" id="emptyMsg">
          <span class="glyph">·· ·· ··</span>
          no entries for this day
        </div>

        <div class="actions">
          <button class="primary" id="copyDay">Copy day</button>
          <button id="copyPlain" title="Copies just the items, one per line, no date heading">Copy items only</button>
          <span class="spacer"></span>
          <button class="danger" id="clearDay">Clear day</button>
        </div>
      </div>
    </main>

    <aside class="panel">
      <div class="panel-head"><span>index</span><span class="rule"></span></div>
      <ul class="daylist" id="dayList"></ul>
      <div class="backup-label">csv · excel</div>
      <div class="backup">
        <button id="csvImportBtn" title="Import entries from a CSV file (date, task)">Import CSV</button>
        <button id="csvExportBtn" title="Export all entries as a CSV file">Export CSV</button>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
      </div>
      <div class="backup-label">backup · json</div>
      <div class="backup">
        <button id="exportBtn" title="Save all data to a JSON file">Export</button>
        <button id="importBtn" title="Load data from a JSON backup file">Import</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </aside>
  </div>

  <footer>── data stays on this machine ──</footer>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "track.tasks.v1";
  var data = load();          // { "YYYY-MM-DD": [{id, text}, ...] }
  var currentDate = todayISO();

  // ---------- storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
    } catch (e) { return {}; }
  }
  function save() {
    // prune empty days so the index stays clean
    Object.keys(data).forEach(function (d) {
      if (!data[d] || data[d].length === 0) delete data[d];
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }
  function newId() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  }

  // ---------- date helpers ----------
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function shiftDay(iso, delta) {
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2] + delta);
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function dateObj(iso) {
    var p = iso.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function prettyDate(iso) {
    return dateObj(iso).toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
  }
  var DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  function shortDow(iso) { return DOW[dateObj(iso).getDay()]; }

  // Accepts 2026-07-05, 2026/07/05, 05/07/2026, 5-7-2026, 05.07.2026.
  // Day-first is assumed for d/m/y unless the first number can only be a month.
  function parseDateFlexible(s) {
    s = String(s || "").trim();
    var m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
    var y, mo, d;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else {
      m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
      if (!m) return null;
      d = +m[1]; mo = +m[2]; y = +m[3];
      if (mo > 12 && d <= 12) { var t = d; d = mo; mo = t; } // clearly month-first
    }
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var check = new Date(y, mo - 1, d);
    if (check.getFullYear() !== y || check.getMonth() !== mo - 1 || check.getDate() !== d) return null;
    return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }

  // ---------- rendering ----------
  var $ = function (id) { return document.getElementById(id); };

  function items() {
    if (!data[currentDate]) data[currentDate] = [];
    return data[currentDate];
  }

  function render() {
    $("datePick").value = currentDate;
    $("headDate").textContent = currentDate;
    $("dayTitle").innerHTML = "";
    var dow = document.createElement("span");
    dow.className = "dow";
    dow.textContent = shortDow(currentDate) + " ";
    $("dayTitle").appendChild(dow);
    $("dayTitle").appendChild(document.createTextNode(prettyDate(currentDate)));

    var list = data[currentDate] || [];
    $("daySub").textContent = list.length === 0 ? "" :
      list.length + (list.length === 1 ? " entry" : " entries") + " logged";

    var ol = $("itemList");
    ol.innerHTML = "";
    list.forEach(function (item) {
      var li = document.createElement("li");

      var num = document.createElement("span");
      num.className = "num";

      var txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = item.text;
      txt.contentEditable = "plaintext-only"; // falls back below if unsupported
      if (txt.contentEditable !== "plaintext-only") txt.contentEditable = "true";
      txt.spellcheck = false;
      txt.title = "Click to edit";
      txt.addEventListener("blur", function () {
        var v = txt.textContent.trim();
        if (v === "") {
          removeItem(item.id);
        } else if (v !== item.text) {
          item.text = v;
          save();
          renderSidebar();
        }
      });
      txt.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); txt.blur(); }
        if (e.key === "Escape") { txt.textContent = item.text; txt.blur(); }
      });

      var del = document.createElement("button");
      del.className = "del";
      del.title = "Delete entry";
      del.textContent = "[x]";
      del.addEventListener("click", function () { removeItem(item.id); });

      li.appendChild(num);
      li.appendChild(txt);
      li.appendChild(del);
      ol.appendChild(li);
    });

    $("emptyMsg").style.display = list.length === 0 ? "" : "none";
    renderSidebar();
  }

  function renderSidebar() {
    var ul = $("dayList");
    ul.innerHTML = "";
    var days = Object.keys(data).filter(function (d) {
      return data[d] && data[d].length > 0;
    }).sort().reverse();

    if (days.length === 0) {
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.className = "nothing";
      span.textContent = "// nothing yet";
      li.appendChild(span);
      ul.appendChild(li);
      return;
    }
    days.forEach(function (d) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      if (d === currentDate) btn.className = "current";
      var label = document.createElement("span");
      label.textContent = shortDow(d) + " " + d;
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = "×" + data[d].length;
      btn.appendChild(label);
      btn.appendChild(count);
      btn.addEventListener("click", function () {
        currentDate = d;
        render();
      });
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  // ---------- actions ----------
  function addItem() {
    var input = $("newItem");
    var v = input.value.trim();
    if (v === "") return;
    items().push({ id: newId(), text: v });
    input.value = "";
    save();
    render();
    input.focus();
  }

  function removeItem(id) {
    var list = items();
    var i = list.findIndex(function (it) { return it.id === id; });
    if (i !== -1) list.splice(i, 1);
    save();
    render();
  }

  function dayAsText(withHeading) {
    var list = data[currentDate] || [];
    var lines = list.map(function (it) { return (withHeading ? "- " : "") + it.text; });
    if (withHeading) lines.unshift(prettyDate(currentDate), "");
    return lines.join("\n");
  }

  function copyText(text, doneMsg) {
    if (text.trim() === "") { toast("nothing to copy — day is empty"); return; }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast(doneMsg); }
      catch (e) { toast("copy failed — select and copy manually"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(doneMsg); }, fallback);
    } else {
      fallback();
    }
  }

  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function downloadFile(name, content, mime) {
    var blob = new Blob([content], { type: mime });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  // ---------- CSV ----------
  // Handles quoted fields, "" escapes, CRLF, and auto-detects , ; or tab.
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
    var firstLine = text.slice(0, text.indexOf("\n") === -1 ? text.length : text.indexOf("\n"));
    var delim = ",";
    var best = (firstLine.match(/,/g) || []).length;
    [[";", (firstLine.match(/;/g) || []).length], ["\t", (firstLine.match(/\t/g) || []).length]]
      .forEach(function (c) { if (c[1] > best) { best = c[1]; delim = c[0]; } });

    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQ = false;
        } else field += c;
      } else if (c === '"') {
        inQ = true;
      } else if (c === delim) {
        row.push(field); field = "";
      } else if (c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
      } else if (c !== "\r") {
        field += c;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) {
      return r.some(function (f) { return f.trim() !== ""; });
    });
  }

  function csvQuote(s) {
    return /[",;\t\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCSV() {
    var days = Object.keys(data).sort();
    if (days.length === 0) { toast("nothing to export"); return; }
    var lines = ["Date,Task"];
    days.forEach(function (d) {
      data[d].forEach(function (it) {
        lines.push(d + "," + csvQuote(it.text));
      });
    });
    // BOM so Excel opens it as UTF-8
    downloadFile("track-export-" + todayISO() + ".csv", "﻿" + lines.join("\r\n"), "text/csv");
    toast("csv exported");
  }

  // Expected shape: one entry per row — date in the first column, task in the
  // second (extra columns are appended to the task). Merges, skips duplicates.
  function importCSV(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result));
      if (rows.length === 0) { toast("csv is empty"); return; }
      var start = parseDateFlexible(rows[0][0]) ? 0 : 1; // skip header row
      var added = 0, skipped = 0, daysTouched = {};
      for (var i = start; i < rows.length; i++) {
        var day = parseDateFlexible(rows[i][0]);
        var text = rows[i].slice(1)
          .map(function (f) { return f.trim(); })
          .filter(function (f) { return f !== ""; })
          .join(", ");
        if (!day || text === "") { skipped++; continue; }
        if (!data[day]) data[day] = [];
        var dup = data[day].some(function (it) { return it.text === text; });
        if (dup) { skipped++; continue; }
        data[day].push({ id: newId(), text: text });
        daysTouched[day] = true;
        added++;
      }
      save();
      render();
      var dayCount = Object.keys(daysTouched).length;
      if (added === 0) {
        toast("nothing imported — " + skipped + " row" + (skipped === 1 ? "" : "s") + " skipped (duplicate or unreadable)");
      } else {
        toast("imported " + added + " entr" + (added === 1 ? "y" : "ies") +
          " across " + dayCount + " day" + (dayCount === 1 ? "" : "s") +
          (skipped ? " — " + skipped + " skipped" : ""));
      }
    };
    reader.readAsText(file);
  }

  // ---------- JSON backup ----------
  function exportData() {
    downloadFile("track-backup-" + todayISO() + ".json",
      JSON.stringify(data, null, 2), "application/json");
    toast("backup exported");
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) {
          throw new Error("bad format");
        }
        var added = 0;
        Object.keys(incoming).forEach(function (day) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Array.isArray(incoming[day])) return;
          if (!data[day]) data[day] = [];
          var existing = data[day].map(function (it) { return it.text; });
          incoming[day].forEach(function (it) {
            var text = (it && typeof it.text === "string") ? it.text
                     : (typeof it === "string") ? it : null;
            if (text && existing.indexOf(text) === -1) {
              data[day].push({ id: newId(), text: text });
              existing.push(text);
              added++;
            }
          });
        });
        save();
        render();
        toast("imported " + added + " entr" + (added === 1 ? "y" : "ies"));
      } catch (e) {
        toast("import failed — not a valid Track backup file");
      }
    };
    reader.readAsText(file);
  }

  // ---------- wiring ----------
  $("addBtn").addEventListener("click", addItem);
  $("newItem").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addItem();
  });
  $("datePick").addEventListener("change", function () {
    if (this.value) { currentDate = this.value; render(); }
  });
  $("prevDay").addEventListener("click", function () {
    currentDate = shiftDay(currentDate, -1); render();
  });
  $("nextDay").addEventListener("click", function () {
    currentDate = shiftDay(currentDate, 1); render();
  });
  $("todayBtn").addEventListener("click", function () {
    currentDate = todayISO(); render();
  });
  $("copyDay").addEventListener("click", function () {
    copyText(dayAsText(true), "day copied to clipboard");
  });
  $("copyPlain").addEventListener("click", function () {
    copyText(dayAsText(false), "entries copied to clipboard");
  });
  $("clearDay").addEventListener("click", function () {
    var list = data[currentDate] || [];
    if (list.length === 0) { toast("day is already empty"); return; }
    if (confirm("Delete all " + list.length + " entr" + (list.length === 1 ? "y" : "ies") + " for " + prettyDate(currentDate) + "?")) {
      delete data[currentDate];
      save();
      render();
      toast("day cleared");
    }
  });
  $("csvExportBtn").addEventListener("click", exportCSV);
  $("csvImportBtn").addEventListener("click", function () { $("csvFile").click(); });
  $("csvFile").addEventListener("change", function () {
    if (this.files && this.files[0]) importCSV(this.files[0]);
    this.value = "";
  });
  $("exportBtn").addEventListener("click", exportData);
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    if (this.files && this.files[0]) importData(this.files[0]);
    this.value = "";
  });

  render();
  $("newItem").focus();
})();
</script>
</body>
</html>
