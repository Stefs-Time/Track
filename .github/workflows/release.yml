# Push a tag like v2.0.0 (matching package.json) to publish a GitHub Release
# with the standalone Docket.html attached as the download.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Docket.html --title "Docket $GITHUB_REF_NAME" --generate-notes
