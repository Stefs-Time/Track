name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # pinned: a new "latest" image can arrive before Playwright supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No known high-severity vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Lint and syntax check
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload the single-file app
        uses: actions/upload-artifact@v7
        with:
          name: Docket.html
          path: dist/Docket.html
          retention-days: 30
